name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      MONGO_TEST_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Started with --quiet (not as a service container) so its log doesn't bury the test output.
      - name: Start MongoDB
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --quiet
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval 'db.runCommand({ ping: 1 })' && break; sleep 1; done
      - run: npm ci
        env:
          MONGOMS_DISABLE_POSTINSTALL: "1"
      - run: npm run typecheck
      - run: npm run build
      - name: Test
        run: npm test -- --reporter=verbose
